[mcp_servers.headroom]
command = "powershell.exe"
args = ["-NoProfile", "-File", "tooling/mcp-launch.ps1", "-Server", "headroom"]
required = true
startup_timeout_sec = 45
tool_timeout_sec = 90
enabled_tools = ["headroom_compress", "headroom_retrieve", "headroom_stats"]

[mcp_servers.headroom.tools.headroom_compress]
output_token_limit = 6000
[mcp_servers.headroom.tools.headroom_retrieve]
output_token_limit = 12000
[mcp_servers.headroom.tools.headroom_stats]
output_token_limit = 2000
